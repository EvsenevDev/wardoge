name: Deploy client to Cloudflare Pages
on:
  push:
    branches: [main]
    paths-ignore: ['server/**']
  workflow_dispatch:
permissions: {contents: read, deployments: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          WARDOGE_SERVER: '${{ vars.WARDOGE_SERVER }}'
          SUPABASE_URL: '${{ vars.SUPABASE_URL }}'
          SUPABASE_ANON_KEY: '${{ vars.SUPABASE_ANON_KEY }}'
        run: |
          mkdir _site
          cp -r index.html assets robots.txt sitemap.xml llms.txt _site/
          echo "window.WARDOGE_SERVER=\"${WARDOGE_SERVER}\";window.WARDOGE_SUPABASE_URL=\"${SUPABASE_URL}\";window.WARDOGE_SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY}\";" > _site/config.js
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=wardoge --branch=main
