<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WarDOGE</title><link rel="icon" href="assets/logo.png">
<style>html,body{margin:0;overflow:hidden;background:#1b1f17;font-family:sans-serif;color:#fff}canvas{display:block;cursor:crosshair}

h1,h2,h3{margin:4px 0 10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid #333}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.item{background:#2e3628;border:2px solid #3b4533;border-radius:8px;padding:8px;cursor:pointer;font-size:13px}
.item.sel{border-color:#f5a623;background:#3d3a22}.item b{display:block;font-size:14px}.price{color:#ffd166}
button{font-size:18px;padding:10px 24px;margin-top:12px;cursor:pointer;border:0;border-radius:8px;background:#f5a623;font-weight:bold}button:disabled{opacity:.4;cursor:default}
input{font-size:16px;padding:6px 10px;border-radius:6px;border:0}.row{display:flex;gap:24px;flex-wrap:wrap}.muted{opacity:.7;font-size:13px}#zb{width:420px;height:16px;background:#0008;border:2px solid #000a;border-radius:9px;overflow:hidden;margin:4px auto 2px;position:relative}
#zb i{display:block;height:100%;transition:background .3s}#zb span{position:absolute;inset:0;font-size:11px;line-height:16px;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
#hud{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#000a;border-radius:12px;padding:10px 16px;min-width:420px;text-shadow:0 1px 2px #000}
.bar{height:14px;background:#333;border-radius:7px;overflow:hidden;margin:3px 0;position:relative}.bar i{display:block;height:100%}.bar span{position:absolute;inset:0;font-size:11px;line-height:14px;padding-left:8px;font-weight:bold}
.hrow{display:flex;gap:10px;align-items:center;font-size:13px}.chip{padding:2px 8px;border-radius:6px;font-size:12px}
#info{bottom:auto;top:auto;display:none}html,body{touch-action:none;-webkit-user-select:none;user-select:none}
#touch{display:none;position:fixed;inset:0;pointer-events:none}#touch.on{display:block}
.stick{position:absolute;bottom:24px;width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40;pointer-events:auto}
.stick i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
#sL{left:24px}#sR{right:24px}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;background:#000a;border:2px solid #ffffff66;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto}
.tb.act{background:#f5a623;color:#000}
@media (max-width:900px),(max-height:500px){#hud{min-width:0;width:46vw;padding:6px 10px;font-size:11px;bottom:6px}#hud .chip{font-size:10px;padding:1px 5px}.hrow{gap:5px;flex-wrap:wrap}
 #zb{width:60vw}#squad{display:none}#feed{font-size:11px;top:52px}.shop{grid-template-columns:repeat(2,1fr)}.panel{padding:12px 14px}#top .s{font-size:15px}}
</style></head><body>
<canvas id="c"></canvas><div id="top"></div><div id="feed"></div><div id="squad" style="position:fixed;top:210px;right:12px;width:190px;font-size:12px;background:#0007;border-radius:8px;padding:6px 8px;line-height:1.5"></div><div id="info"></div><div id="hud"></div>
<div id="touch"><div class="stick" id="sL"><i></i></div><div class="stick" id="sR"><i></i></div>
<div class="tb" id="bG" style="right:170px;bottom:140px">Nade</div><div class="tb" id="bQ" style="right:236px;bottom:96px">Build</div>
<div class="tb" id="bF" style="right:170px;bottom:30px">Heal Revive</div><div class="tb" id="bH" style="right:236px;bottom:24px">Med</div>
<div class="tb" id="bE" style="right:102px;bottom:170px">Tank</div><div class="tb" id="bT" style="right:36px;bottom:170px">Buy tank</div>
<div class="tb" id="bS" style="left:170px;bottom:30px">Sprint</div><div class="tb" id="bB" style="left:12px;top:12px;width:48px;height:48px">Score</div>
<div class="tb" id="bX" style="left:50%;transform:translateX(-50%);bottom:140px;width:110px;border-radius:12px;display:none">Respawn now</div></div>
<div id="lobby" class="ov"><div class="panel" id="lobbyP"></div></div>
<div id="shopOv" class="ov"><div class="panel" id="shopP"></div></div>
<div id="board" class="ov" style="background:#000a"><div class="panel" id="boardP"></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=rs;rs();
const $=id=>document.getElementById(id);
let ZOOM=.75;const VIS=600,MW=7000,MH=7000,WIN=20,PER=15,TICK=1800,DOWNT=40*60,RESP=6*60;
const TEAMS=[{n:'Red',c:'#e74c3c'},{n:'Blue',c:'#3498db'},{n:'Green',c:'#2ecc71'}];
const WEAP=[{n:'Rifle',p:0,cd:17,dmg:15,sp:5.6,k:1,spr:.04,life:106,r:3,rng:450},{n:'Shotgun',p:150,cd:66,dmg:12,sp:5.2,k:6,spr:.22,life:52,r:3,rng:220},
{n:'Rocket launcher',p:400,cd:132,dmg:75,sp:4,k:1,spr:0,life:162,r:6,boom:100,rng:500},{n:'Sniper',p:350,cd:120,dmg:110,sp:10.4,k:1,spr:0,life:106,r:2,rng:950}];
const GEAR={helmet:{n:'Helmet',p:150,d:'Takes 20% less damage'},armor:{n:'Body armor',p:250,d:'Absorbs 60% of damage until its 100 points run out'},gren:{n:'Grenades x3',p:120,d:'G to throw where you aim'},med:{n:'Medkits x3',p:90,d:'H heals you, F heals a teammate'}};
// ---------- account (saved in this browser) ----------
const newProf=n=>({name:n||'Player',cash:1500,xp:0,matches:0,wins:0,kills:0,deaths:0,revives:0,history:[]});
let accts=JSON.parse(localStorage.getItem('hzw_accts')||'{}'),who=null,prof=newProf();
function hsh(t){let h=5381;for(const ch of t)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'h'+(h>>>0).toString(36)}
function save(){if(!who)return;accts[who].prof=prof;localStorage.setItem('hzw_accts',JSON.stringify(accts))}
function startScreen(err){$('lobby').style.display='flex';const v=id=>($(id)||{}).value||'';
 $('lobbyP').innerHTML=`<h1>WarDOGE</h1><div class="row" style="align-items:flex-start">
 <div style="flex:1;min-width:260px"><h3>Quick play</h3><input id="gname" placeholder="Your name" maxlength="14"><br><button onclick="guest()">Play as guest</button><div class="muted" style="margin-top:6px">Guests start with $1,500 every time and nothing is saved.</div></div>
 <div style="flex:1;min-width:260px"><h3>Log in to save progress</h3><input id="lu" placeholder="Username" maxlength="14"><br><input id="lp" type="password" placeholder="Password" style="margin-top:6px"><br>
 <button onclick="login(false)">Log in</button> <button onclick="login(true)" style="background:#888">Create account</button>
 <div style="color:#ff6b6b;margin-top:6px">${err||''}</div><div class="muted" style="margin-top:6px">Your cash, level, stats and match history carry over between games.</div></div></div>`}
function guest(){const n=($('gname').value||'').trim();if(!n){$('gname').style.outline='2px solid #ff6b6b';return}who=null;prof=newProf(n);showLobby()}
function login(create){const u=($('lu').value||'').trim(),pw=$('lp').value||'';if(!u||!pw)return startScreen('Enter a username and password.');
 if(create){if(accts[u])return startScreen('That username is taken.');accts[u]={pw:hsh(pw),prof:newProf(u)}}
 else if(!accts[u]||accts[u].pw!==hsh(pw))return startScreen('Wrong username or password.');
 who=u;prof=accts[u].prof;save();showLobby()}
function logout(){who=null;startScreen()}
const level=()=>1+Math.floor(prof.xp/1000);
let load=JSON.parse(localStorage.getItem('hzw_load')||'null')||{w:0,helmet:false,armor:false,gren:false,med:true};
function loadCost(l){return WEAP[l.w].p+['helmet','armor','gren','med'].reduce((a,k)=>a+(l[k]?GEAR[k].p:0),0)}
// ---------- game state ----------
let rnd;function seed(s){rnd=()=>(s=(s*16807)%2147483647)/2147483647}
let walls,grid,units,tanks,bullets,nades,booms,score,keys={},mouse={x:0,y:0,down:false},me,running=false,tick=0,feed=[],CZ,HZ,bases,startCash;
const GS=300;const gk=(x,y)=>(x/GS|0)+','+(y/GS|0);
function addWall(w){walls.push(w);for(let x=w.x/GS|0;x<=(w.x+w.w)/GS|0;x++)for(let y=w.y/GS|0;y<=(w.y+w.h)/GS|0;y++){const k=x+','+y;(grid[k]=grid[k]||[]).push(w)}}
function delWall(w){walls=walls.filter(v=>v!==w);for(let x=w.x/GS|0;x<=(w.x+w.w)/GS|0;x++)for(let y=w.y/GS|0;y<=(w.y+w.h)/GS|0;y++){const k=x+','+y;if(grid[k])grid[k]=grid[k].filter(v=>v!==w)}}
function hitWall(x,y,r){if(x<r||y<r||x>MW-r||y>MH-r)return {edge:1};const l=grid[gk(x,y)];if(!l)return null;for(const w of l)if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return w;return null}
function keyOf(e){const c=e.code||'';if(c.startsWith('Key'))return c.slice(3).toLowerCase();if(c.startsWith('Digit'))return c.slice(5);
 if(c.startsWith('Shift'))return 'shift';if(c=='Space')return ' ';if(c=='Tab')return 'tab';if(c=='Enter'||c=='NumpadEnter')return 'enter';return (e.key||'').toLowerCase()}
onkeydown=e=>{const k=keyOf(e);if(document.activeElement.tagName=='INPUT')return;keys[k]=true;if(k=='enter'&&me&&me.dead<0&&running)respawn();if(k=='tab'){e.preventDefault();if(running)showBoard(true)}
 if(!me||!running||me.down||me.dead)return;if(k=='e')toggleTank(me);if(k=='q')build(me,me.ang);if(k=='h')medkit(me);if(k=='t')buyTank(me);if(k=='g')throwNade(me,me.x+(mouse.x-W/2)/ZOOM,me.y+(mouse.y-H/2)/ZOOM)};
onkeyup=e=>{const k=keyOf(e);keys[k]=false;if(k=='tab'&&running)showBoard(false);if(k==' '&&me&&me.down&&running)bleed(me)};
c.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};c.onmousedown=()=>mouse.down=true;onmouseup=()=>mouse.down=false;
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function log(s){feed.unshift({s,l:300});feed=feed.slice(0,6)}
function makeMap(){walls=[];grid={};seed(Math.floor(Math.random()*1e9));
 const a0=rnd()*6.28;bases=[0,1,2].map(i=>({x:MW/2+Math.cos(a0+i*2.094)*2900,y:MH/2+Math.sin(a0+i*2.094)*2900}));
 CZ={x:MW/2+(rnd()-.5)*1400,y:MH/2+(rnd()-.5)*1400,r:850};HZ={x:CZ.x,y:CZ.y,r:200,tx:CZ.x,ty:CZ.y};
 for(let i=0;i<170;i++){const x=100+rnd()*(MW-400),y=100+rnd()*(MH-400);if(bases.some(b=>Math.hypot(b.x-x,b.y-y)<420))continue;
  if(rnd()<.45){const w=120+rnd()*180,h=120+rnd()*180,t=22;addWall({x,y,w,h:t});addWall({x,y:y+h,w:w*.4,h:t});addWall({x:x+w*.65,y:y+h,w:w*.35+t,h:t});addWall({x,y,w:t,h});addWall({x:x+w,y,w:t,h:h*.5})}
  else if(rnd()<.5)addWall({x,y,w:40+rnd()*260,h:30});else addWall({x,y,w:30,h:40+rnd()*260})}
 tanks=[];for(let i=0;i<8;i++){let p;do p={x:400+rnd()*(MW-800),y:400+rnd()*(MH-800)};while(hitWall(p.x,p.y,40));tanks.push(mkTank(p.x,p.y))}}
const mkTank=(x,y)=>({x,y,hp:500,ang:0,driver:null,dead:0});
let myTeam=+(localStorage.getItem('hzw_team')||1)%3;
const BOTN0=['Rex','Ace','Bolt','Fang','Ghost','Hawk','Jinx','Kilo','Lynx','Moose','Nova','Ozzy','Pike','Rook','Scout','Tank','Viper','Wolf','Yeti','Zed','Bear','Duke','Echo','Flint'];
const BOTN=BOTN0;
function equip(u,l){u.w=l.w;u.helmet=l.helmet;u.armor=l.armor?100:0;u.gren=l.gren?3:0;u.med=l.med?3:0}
function spawn(u){const b=bases[u.t];u.x=b.x+(Math.random()-.5)*160;u.y=b.y+(Math.random()-.5)*160;u.hp=100;u.down=0;u.dead=0;u.tank=null;u.revived=false;u.rev=0;u.tgt=null;
 if(u.bot){const l={w:[0,0,1,2,3][Math.floor(Math.random()*5)],helmet:Math.random()<.5,armor:Math.random()<.4,gren:Math.random()<.5,med:Math.random()<.7};equip(u,l)}}
function begin(){makeMap();units=[];score=[0,0,0];bullets=[];nades=[];booms=[];tick=0;feed=[];startCash=prof.cash;
 for(let t=0;t<3;t++)for(let i=0;i<PER;i++){const u={t,bot:!(t==myTeam&&i==0),ang:0,kills:0,deaths:0,revs:0,earned:0,name:BOTN[(t*PER+i)%BOTN.length]+((t*PER+i)>=BOTN.length?' '+(1+Math.floor((t*PER+i)/BOTN.length)):'')};spawn(u);units.push(u)}
 me=units.find(u=>!u.bot);me.name=prof.name;me.x=bases[myTeam].x;me.y=bases[myTeam].y;
 if(!buyLoadout(me)){equip(me,{w:0})}
 $('lobby').style.display='none';running=true;log('Deployed. Head for the Control Zone!')}
function buyLoadout(u){const cost=loadCost(load);if(prof.cash<cost)return false;prof.cash-=cost;save();equip(u,load);return true}
function inHZ(u){return Math.hypot(u.x-HZ.x,u.y-HZ.y)<HZ.r}function inCZ(u){return Math.hypot(u.x-CZ.x,u.y-CZ.y)<CZ.r}
function pay(u,v,why){if(inHZ(u))v*=2;u.earned+=v;if(u===me){prof.cash+=v;if(why)log(`+$${v} ${why}`)}}
function spend(u,v){if(u!==me)return true;if(prof.cash<v)return false;prof.cash-=v;return true}
function toggleTank(u){if(u.tank){u.tank.driver=null;u.tank=null;u.x+=45;return}for(const k of tanks)if(!k.driver&&!k.dead&&d2(k,u)<75){k.driver=u;u.tank=k;return}}
function buyTank(u){if(Math.hypot(u.x-bases[u.t].x,u.y-bases[u.t].y)>350){log('Tanks can only be bought at your base');return}if(!spend(u,600)){log('Not enough cash for a tank ($600)');return}tanks.push(mkTank(u.x+60,u.y));log('Tank delivered. Press E to get in')}
function build(u,ang){if(u.tank)return;const x=u.x+Math.cos(ang)*60,y=u.y+Math.sin(ang)*60,vert=Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang));const w=vert?24:90,h=vert?90:24;
 const nw={x:x-w/2,y:y-h/2,w,h,hp:250,built:u.t};if(units.some(o=>!o.dead&&o.x+16>nw.x&&o.x-16<nw.x+w&&o.y+16>nw.y&&o.y-16<nw.y+h))return;if(!spend(u,25)){log('Need $25 to build');return}addWall(nw)}
function medkit(u){if(u.hp>=100||u.med<=0){if(u===me&&u.med<=0)log('No medkits left');return}u.med--;u.hp=Math.min(100,u.hp+60);if(u===me)log('Used a medkit')}
function throwNade(u,tx,ty){if(u.gren<=0||u.tank){if(u===me)log('No grenades');return}u.gren--;const a=Math.atan2(ty-u.y,tx-u.x),d=Math.min(420,Math.hypot(tx-u.x,ty-u.y));nades.push({x:u.x,y:u.y,vx:Math.cos(a)*d/62,vy:Math.sin(a)*d/62,t:0,o:u})}
function moveU(u,dx,dy,sprint){const k=u.tank;let sp=k?1.0:(sprint?1.7:1.15);const r=k?28:14;const d=Math.hypot(dx,dy);if(!d)return;dx=dx/d*sp;dy=dy/d*sp;
 const o=k||u;if(!hitWall(o.x+dx,o.y,r))o.x+=dx;if(!hitWall(o.x,o.y+dy,r))o.y+=dy;if(k){u.x=k.x;u.y=k.y;k.ang=Math.atan2(dy,dx)}}
function shoot(u,ang){if(u.cd>0)return;
 if(u.tank){bullets.push({x:u.x+Math.cos(ang)*36,y:u.y+Math.sin(ang)*36,vx:Math.cos(ang)*4.8,vy:Math.sin(ang)*4.8,dmg:85,life:162,r:7,boom:120,o:u});u.cd=108;return}
 const w=WEAP[u.w];for(let i=0;i<w.k;i++){const a=ang+(Math.random()-.5)*w.spr*2;bullets.push({x:u.x+Math.cos(a)*18,y:u.y+Math.sin(a)*18,vx:Math.cos(a)*w.sp,vy:Math.sin(a)*w.sp,dmg:w.dmg,life:w.life,r:w.r,boom:w.boom,o:u})}u.cd=w.cd}
function damage(u,dm,by){if(u.dead||u.down)return; // downed players can't be hurt
 if(u.tank){const k=u.tank;k.hp-=dm;if(k.hp<=0){k.dead=1;k.driver=null;u.tank=null;booms.push({x:k.x,y:k.y,r:140,l:30});if(by&&by.t!=u.t)pay(by,200,'tank destroyed');damage(u,70,by)}return}
 if(u.helmet)dm*=.8;if(u.armor>0){const ab=Math.min(u.armor,dm*.6);u.armor-=ab;dm-=ab}
 u.hp-=dm;if(u.hp<=0){u.hp=0;if(by&&by.t!=u.t){by.kills++;pay(by,100,'enemy down')}
  if(u.revived){kill(u);if(u===me)log('You were taken out (already revived once this life)')}else{u.down=DOWNT;u.cd=0;if(u===me)log('You\'re down! Wait for a revive or hold Space to respawn')}}}
function kill(u){u.down=0;u.dead=RESP;u.deaths++;if(u.tank){u.tank.driver=null;u.tank=null}if(u===me){showShop()}}
function bleed(u){if(u.down)kill(u)}
function explode(b){booms.push({x:b.x,y:b.y,r:b.boom,l:20});for(const u of units)if(!u.dead&&u.t!=b.o.t){const d=d2(u,b);if(d<b.boom)damage(u,b.dmg*(1-d/b.boom*.6),b.o)}
 for(const k of tanks)if(!k.dead&&!k.driver&&d2(k,b)<b.boom)k.hp-=b.dmg*.5;
 for(const w of walls.slice())if(w.hp&&Math.hypot(w.x+w.w/2-b.x,w.y+w.h/2-b.y)<b.boom+40){w.hp-=b.dmg*2;if(w.hp<=0)delWall(w)}}
function los(a,b){const n=Math.ceil(d2(a,b)/25);for(let i=1;i<n;i++)if(hitWall(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,2))return false;return true}
function tend(u){let best=null,bd=55;for(const o of units)if(o!==u&&o.t==u.t&&!o.dead&&(o.down||o.hp<100)){const d=d2(o,u);if(d<bd){bd=d;best=o}}
 if(!best){u.rev=0;return null}
 if(best.down){u.rev++;if(u.rev>=150){best.down=0;best.hp=35;best.revived=true;u.rev=0;u.revs++;pay(u,150,'teammate revived');if(best===me)log('You were revived! (only once per life)')}}
 else if(u.med>0){u.rev++;if(u.rev>=60){u.med--;best.hp=Math.min(100,best.hp+60);u.rev=0;pay(u,40,'healed a teammate')}}
 else{u.rev=0;if(u===me&&tick%120==0)log('Need a medkit to heal teammates')}return best}
function bot(u){
 if(tick%12==u.id%12){let tgt=null,bd=WEAP[u.w].rng*(u.tank?1.2:1);for(const o of units)if(!o.dead&&!o.down&&o.t!=u.t){const d=d2(o,u);if(d<bd&&los(u,o)){bd=d;tgt=o}}u.tgt=tgt;u.td=bd}
 const tgt=u.tgt&&!u.tgt.dead&&!u.tgt.down?u.tgt:null;
 if(u.hp<40)medkit(u);
 let mate=null;if(!tgt||u.td>300)for(const o of units)if(o.t==u.t&&o!==u&&(o.down||(o.hp<50&&u.med>0&&!o.dead))&&!u.tank&&d2(o,u)<400){mate=o;break}

 <div class="hrow"><b>Armor&nbsp;</b><div class="bar" style="flex:1"><i style="width:${me.armor}%;background:#7aa7d8"></i><span>${me.armor>0?Math.ceil(me.armor):'None'}</span></div></div>
 <div class="hrow" style="margin-top:4px"><span class="chip" style="background:#333">${me.tank?'Tank cannon':w.n}</span><div class="bar" style="width:70px;height:6px"><i style="width:${Math.max(0,cdp)*100}%;background:#ffd166"></i></div>
 <span class="chip" style="background:${me.helmet?'#2f6b2f':'#5a2a2a'}">Helmet</span><span class="chip" style="background:#333">Grenades ${me.gren}</span><span class="chip" style="background:#333">Medkits ${me.med}</span>
 <span class="chip" style="background:#333">$${prof.cash}</span><span class="chip" style="background:#333">Kills ${me.kills}</span></div>
 <div style="font-size:12px;margin-top:4px">${where}${me.tending?(me.tending.down?' &nbsp; Reviving...':' &nbsp; Healing...'):''}${me.revived?' &nbsp; <span style="color:#ff6b6b">Already revived this life</span>':''}</div>`}
function gearRow(){const it=(on,txt)=>`<span style="display:inline-block;padding:2px 8px;margin:0 4px 4px 0;border-radius:6px;background:${on?'#2f6b2f':'#5a2a2a'};font-size:12px">${on?'✔':'✖'} ${txt}</span>`;
 return `<div>${it(true,me.tank?'Tank':WEAP[me.w].n)}${it(me.helmet,'Helmet')}${it(me.armor>0,'Armor '+Math.ceil(me.armor))}${it(me.gren>0,'Grenades '+me.gren)}${it(me.med>0,'Medkits '+me.med)}</div>`}
function bar(x,y,p,col){g.fillStyle='#0008';g.fillRect(x-16,y,32,4);g.fillStyle=col||(p>.5?'#4cd964':p>.25?'#ffcc00':'#ff3b30');g.fillRect(x-16,y,32*Math.max(0,Math.min(1,p)),4)}
function loop(){if(units){step();draw()}requestAnimationFrame(loop)}
// ---------- touch controls ----------
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);const joy={L:{x:0,y:0,on:false},R:{x:0,y:0,on:false},sprint:false};
if(isTouch){$('touch').classList.add('on');
 const stick=(id,J)=>{const el=$(id),knob=el.firstElementChild;let tid=null;
  const upd=t=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(t.clientX-cx)/55,y=(t.clientY-cy)/55;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}J.x=x;J.y=y;knob.style.transform=`translate(${x*45}px,${y*45}px)`};
  el.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];tid=t.identifier;J.on=true;upd(t)},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier==tid)upd(t)},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier==tid){tid=null;J.on=false;J.x=J.y=0;knob.style.transform=''}};el.addEventListener('touchend',end);el.addEventListener('touchcancel',end)};
 stick('sL',joy.L);stick('sR',joy.R);
 const tap=(id,fn)=>$(id).addEventListener('touchstart',e=>{e.preventDefault();if(running&&me&&!me.dead)fn()},{passive:false});
 const ok=()=>!me.down;
 tap('bG',()=>ok()&&throwNade(me,me.x+Math.cos(me.ang)*300,me.y+Math.sin(me.ang)*300));tap('bQ',()=>ok()&&build(me,me.ang));tap('bH',()=>ok()&&medkit(me));
 tap('bE',()=>ok()&&toggleTank(me));tap('bT',()=>ok()&&buyTank(me));tap('bX',()=>me.down&&bleed(me));
 tap('bS',()=>{joy.sprint=!joy.sprint;$('bS').classList.toggle('act',joy.sprint)});
 const hold=(id,on,off)=>{const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();on();el.classList.add('act')},{passive:false});const f=()=>{off();el.classList.remove('act')};el.addEventListener('touchend',f);el.addEventListener('touchcancel',f)};
 hold('bF',()=>keys.f=true,()=>keys.f=false);hold('bB',()=>running&&showBoard(true),()=>running&&showBoard(false));
 setInterval(()=>{const v=running&&me;$('touch').style.display=v&&!me.dead?'block':'none';$('bX').style.display=v&&me.down?'flex':'none'},200)}
startScreen();loop();
</script></body></html>
