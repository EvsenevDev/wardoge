# Fly.io config. Change `app` to the name you create with `fly apps create`.
app = "wardoge-server"
primary_region = "sjc"

[env]
  ALLOWED_ORIGINS = "https://wardoge.ai,https://www.wardoge.ai"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
