# fly.toml app configuration file generated for wardoge-server on 2026-10-16T00:05:24-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wardoge-server'
primary_region = 'sjc'

[build]
[env]
  ALLOWED_ORIGINS = 'https://wardoge.io,https://www.wardoge.io'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
